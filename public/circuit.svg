<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer Glow / Background -->
  <rect width="64" height="64" rx="16" fill="#0A0A0A"/>
  
  <!-- Main Chip Body -->
  <rect x="18" y="18" width="28" height="28" rx="4" fill="#121212" stroke="#00FF6A" stroke-width="2.5"/>

  <!-- Chip Core Surface Grid -->
  <rect x="24" y="24" width="16" height="16" rx="2" fill="#00FF6A" fill-opacity="0.15" stroke="#00FF6A" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- Top Pins -->
  <line x1="24" y1="8" x2="24" y2="18" stroke="#00FF6A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="8" x2="32" y2="18" stroke="#00FF6A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="8" x2="40" y2="18" stroke="#00FF6A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Bottom Pins -->
  <line x1="24" y1="46" x2="24" y2="56" stroke="#00FF6A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="46" x2="32" y2="56" stroke="#00FF6A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="46" x2="40" y2="56" stroke="#00FF6A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left Pins -->
  <line x1="8" y1="24" x2="18" y2="24" stroke="#00FF6A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="8" y1="32" x2="18" y2="32" stroke="#00FF6A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="8" y1="40" x2="18" y2="40" stroke="#00FF6A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Right Pins -->
  <line x1="46" y1="24" x2="56" y2="24" stroke="#00FF6A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="46" y1="32" x2="56" y2="32" stroke="#00FF6A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="46" y1="40" x2="56" y2="40" stroke="#00FF6A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Circuit Trace Nodes -->
  <circle cx="24" cy="8" r="2" fill="#00FF6A"/>
  <circle cx="32" cy="8" r="2" fill="#00FF6A"/>
  <circle cx="40" cy="8" r="2" fill="#00FF6A"/>
  <circle cx="24" cy="56" r="2" fill="#00FF6A"/>
  <circle cx="32" cy="56" r="2" fill="#00FF6A"/>
  <circle cx="40" cy="56" r="2" fill="#00FF6A"/>
  <circle cx="8" cy="24" r="2" fill="#00FF6A"/>
  <circle cx="8" cy="32" r="2" fill="#00FF6A"/>
  <circle cx="8" cy="40" r="2" fill="#00FF6A"/>
  <circle cx="56" cy="24" r="2" fill="#00FF6A"/>
  <circle cx="56" cy="32" r="2" fill="#00FF6A"/>
  <circle cx="56" cy="40" r="2" fill="#00FF6A"/>
</svg>
