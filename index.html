            // --- Visitor Tracking Logic ---
            function trackVisitor() {
                try {
                    const VISITOR_KEY = 'portfolio_visitor_id';
                    let visitorId = localStorage.getItem(VISITOR_KEY);
                    let isFirstVisit = false;

                    // If no ID exists, create one
                    if (!visitorId) {
                        visitorId = 'user_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
                        localStorage.setItem(VISITOR_KEY, visitorId);
                        isFirstVisit = true;
                    }

                    // Create a reference to the 'visitors' node
                    const visitsRef = ref(database, 'visitors');

                    // Data to store
                    const visitData = {
                        visitorId: visitorId,
                        timestamp: serverTimestamp(),
                        lastSeen: new Date().toISOString(),
                        userAgent: navigator.userAgent,
                        resolution: `${window.screen.width}x${window.screen.height}`,
                        isFirstVisit: isFirstVisit
                    };

                    // Push new visit entry
                    push(visitsRef, visitData)
                        .then(() => console.log("✅ Visitor logged to Firebase DB:", visitorId))
                        .catch((err) => console.error("❌ Error logging visitor:", err));

                } catch (err) {
                    console.error("Tracking Error:", err);
                }
            }

            // Run tracking
            trackVisitor();

        } catch (e) {
            console.error("Firebase Init Error:", e);
        }

        const NetworkEffect = () => {
            const [nodes, setNodes] = useState([]);
            const [lines, setLines] = useState([]);

            // Generate random floating nodes
            useEffect(() => {
                const nodeCount = 25; // As per guide
                const initialNodes = [];
                for (let i = 0; i < nodeCount; i++) {
                    initialNodes.push({
                        id: i,
                        x: Math.random() * 100,
                        y: Math.random() * 100,
                        // Random velocities for floating effect
                        vx: (Math.random() - 0.5) * 0.15,
                        vy: (Math.random() - 0.5) * 0.15,
                    });
                }
                setNodes(initialNodes);
            }, []);

            // Animation Loop for floating movement and line connections
            useAnimationLoop((time) => {
                setNodes(prevNodes => prevNodes.map(node => {
                    let newX = node.x + node.vx;
                    let newY = node.y + node.vy;

                    // Bounce off edges
                    if (newX <= 0 || newX >= 100) node.vx *= -1;
                    if (newY <= 0 || newY >= 100) node.vy *= -1;

                    return { ...node, x: newX, y: newY };
                }));

                setLines(calculateLines(nodes));
            });

            // Calculate connections
            const calculateLines = (currentNodes) => {
                const newLines = [];
                const maxDistance = 20; // 20% of screen width connection range

                for (let i = 0; i < currentNodes.length; i++) {
                    for (let j = i + 1; j < currentNodes.length; j++) {
                        const node1 = currentNodes[i];
                        const node2 = currentNodes[j];

                        const dx = node1.x - node2.x;
                        const dy = node1.y - node2.y;
                        // Approximate aspect ratio correction (assuming 16:9 roughly, or just use raw %)
                        const aspectCorrection = 1.77;
                        const dist = Math.sqrt(dx * dx + (dy * dy * aspectCorrection));

                        if (dist < maxDistance) {
                            newLines.push({
                                id: `${node1.id}-${node2.id}`,
                                x1: node1.x, y1: node1.y,
                                x2: node2.x, y2: node2.y,
                                opacity: 1 - (dist / maxDistance) // Fade out as they get further
                            });
                        }
                    }
                }
                return newLines;
            };

            return (
                <div className="absolute inset-0 z-0 pointer-events-none">
                    {/* Lines */}
                    {lines.map(line => {
                        const angle = Math.atan2(line.y2 - line.y1, line.x2 - line.x1) * 180 / Math.PI;
                        const length = Math.sqrt(Math.pow(line.x2 - line.x1, 2) + Math.pow(line.y2 - line.y1, 2));
                        return (
                            <div
                                key={line.id}
                                className="absolute h-[1px] bg-neon origin-left"
                                style={{
                                    left: `${line.x1}%`,
                                    top: `${line.y1}%`,
                                    width: `${length}%`,
                                    transform: `rotate(${angle}deg)`,
                                    opacity: line.opacity * 0.4
                                }}
                            />
                        );
                    })}

                    {/* Nodes */}
                    {nodes.map(node => (
                        <div
                            key={node.id}
                            className="absolute w-1.5 h-1.5 bg-neon rounded-full"
                            style={{
                                left: `${node.x}%`,
                                top: `${node.y}%`,
                                transform: 'translate(-50%, -50%)',
                                boxShadow: `0 0 10px #00ff00`
                            }}
                        />
                    ))}
                </div>
            );
        };

        // Helper hook for animation frame
        const useAnimationLoop = (callback) => {
            const requestRef = useRef();
            const animate = (time) => {
                callback(time);
                requestRef.current = requestAnimationFrame(animate);
            };
            useEffect(() => {
                requestRef.current = requestAnimationFrame(animate);
                return () => cancelAnimationFrame(requestRef.current);
            }, [callback]); // Careful with dependency here
        };

        // 2. Custom Cursor
        const Cursor = () => {
            const mouseX = useMotionValue(-100);
            const mouseY = useMotionValue(-100);

            const springConfig = { damping: 25, stiffness: 700 };
            const dotX = useSpring(mouseX, springConfig);
            const dotY = useSpring(mouseY, springConfig);
            const outlineX = useSpring(mouseX, { damping: 20, stiffness: 300 });
            const outlineY = useSpring(mouseY, { damping: 20, stiffness: 300 });

            useEffect(() => {
                const moveCursor = (e) => {
                    mouseX.set(e.clientX);
                    mouseY.set(e.clientY);
                };
                window.addEventListener("mousemove", moveCursor);
                return () => window.removeEventListener("mousemove", moveCursor);
            }, []);

            return (

        };

                        DESIGNED &amp; BUILT BY <span className="text-neon font-medium">RAKESH KUMAR M M</span> <br />
                        <span className="text-white/20">© 2026</span>
                    </p>
                </footer>
            )
        };

        // Helper: Magnetic Button
        const MagneticButton = ({ children, className, onClick, href, target, rel }) => {
            const ref = useRef(null);
            const x = useMotionValue(0);
            const y = useMotionValue(0);

            const handleMouseMove = (e) => {
                const { left, top, width, height } = ref.current.getBoundingClientRect();
                const centerX = left + width / 2;
                const centerY = top + height / 2;
                x.set((e.clientX - centerX) * 0.3);
                y.set((e.clientY - centerY) * 0.3);
            };

            const handleMouseLeave = () => {
                x.set(0);
                y.set(0);
            };

            const Wrapper = href ? 'a' : 'button';

            return (
                <motion.div style={{ x, y }} className="inline-block">
                    <Wrapper
                        ref={ref}
                        href={href}
                        target={target}
                        rel={rel}
                        onClick={onClick}
                        onMouseMove={handleMouseMove}
                        onMouseLeave={handleMouseLeave}
                        className={`relative overflow-hidden group ${className}`}
                    >
                        {children}
                    </Wrapper>
                </motion.div>
            );
        };

        // Main App
        const App = () => {
            const [showIntro, setShowIntro] = useState(true);

            useEffect(() => {
                window.lucide.createIcons();
            });

            return (
                <main className="bg-black text-white min-h-screen relative selection:bg-neon selection:text-black font-sans">
                    <Background />
                    <AnimatePresence>
                        {showIntro && <Intro onComplete={() => setShowIntro(false)} />}
                    </AnimatePresence>

                    {!showIntro && (
                        <motion.div
                            initial={{ opacity: 0 }}
                            animate={{ opacity: 1 }}
                            transition={{ duration: 1 }}
                        >
                            <Cursor />
                            <Navbar />
                            <Hero />
                            <About />
                            <Services />
                            <Skills />
                            <Projects />
                            <Philosophy />
                            <Footer />
                        </motion.div>
                    )}
                </main>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
